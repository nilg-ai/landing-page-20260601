<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Falar com o assistente | NILG.AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #353cdd;
  --accent: #ff6900;
  --bg: #08080f;
  --surface: #111118;
  --text: #f0f0f5;
  --text-muted: #8888aa;
  --border: rgba(255,255,255,0.07);
}
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', system-ui, sans-serif;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 28px 22px calc(28px + env(safe-area-inset-bottom));
  text-align: center;
  overflow-x: hidden;
}

/* brilho suave atras do botao, so decorativo */
body::before {
  content: '';
  position: fixed;
  top: 42%; left: 50%;
  width: 460px; height: 460px;
  transform: translate(-50%, -50%);
  background: radial-gradient(circle, rgba(53,60,221,0.20), transparent 68%);
  pointer-events: none;
}

.marca {
  position: fixed;
  top: calc(20px + env(safe-area-inset-top));
  left: 0; right: 0;
  display: flex; justify-content: center;
}
.marca img { height: 22px; opacity: 0.85; }

.palco { position: relative; max-width: 420px; width: 100%; }

h1 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: clamp(1.5rem, 6vw, 2rem);
  line-height: 1.18;
  font-weight: 700;
  margin-bottom: 12px;
}
.sub {
  color: var(--text-muted);
  font-size: 0.97rem;
  line-height: 1.55;
  margin-bottom: 34px;
}

/* ---- botao de atender ---- */
.botao {
  position: relative;
  width: 128px; height: 128px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  background: linear-gradient(150deg, #4148ea, var(--primary));
  box-shadow: 0 14px 44px rgba(53,60,221,0.42);
  display: grid; place-items: center;
  margin: 0 auto 22px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}
.botao:hover { transform: translateY(-3px); box-shadow: 0 18px 54px rgba(53,60,221,0.55); }
.botao:active { transform: scale(0.96); }
.botao svg { width: 46px; height: 46px; }

/* halo a pulsar, para o botao pedir o toque */
.botao::after {
  content: '';
  position: absolute; inset: -14px;
  border-radius: 50%;
  border: 1px solid rgba(53,60,221,0.5);
  animation: halo 2.4s ease-out infinite;
}
@keyframes halo {
  0%   { transform: scale(0.9); opacity: 0.8; }
  100% { transform: scale(1.25); opacity: 0; }
}

.nota {
  font-size: 0.82rem;
  color: var(--text-muted);
  line-height: 1.5;
}
.nota a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }

/* ---- estado: em chamada ---- */
.ondas { display: none; justify-content: center; gap: 5px; height: 46px; align-items: center; margin-bottom: 20px; }
.ondas span {
  width: 4px; border-radius: 2px; background: var(--primary);
  animation: onda 1.1s ease-in-out infinite;
}
.ondas span:nth-child(1) { height: 14px; animation-delay: 0s; }
.ondas span:nth-child(2) { height: 30px; animation-delay: 0.12s; }
.ondas span:nth-child(3) { height: 44px; animation-delay: 0.24s; }
.ondas span:nth-child(4) { height: 26px; animation-delay: 0.36s; }
.ondas span:nth-child(5) { height: 16px; animation-delay: 0.48s; }
@keyframes onda { 0%, 100% { transform: scaleY(0.45); } 50% { transform: scaleY(1); } }

body.em-chamada .botao,
body.em-chamada .nota { display: none; }
body.em-chamada .ondas { display: flex; }

/* o widget da ElevenLabs traz os seus proprios controlos (mudo, desligar).
   Fica escondido ate a chamada arrancar, para nao competir com o botao. */
#agente { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
body.em-chamada #agente { opacity: 1; pointer-events: auto; }

.rodape {
  position: fixed;
  bottom: calc(18px + env(safe-area-inset-bottom));
  left: 0; right: 0;
  font-size: 0.74rem;
  color: rgba(136,136,170,0.6);
}
.rodape a { color: inherit; }

.erro-acao {
  display: inline-block;
  margin-top: 20px;
  padding: 13px 26px;
  border-radius: 8px;
  background: var(--primary);
  color: #fff;
  text-decoration: none;
  font-size: 0.92rem;
  font-weight: 500;
}

@media (prefers-reduced-motion: reduce) {
  .botao::after, .ondas span { animation: none; }
}
</style>
</head>
<body>

<div class="marca">
  <img src="https://eventos.nilg.ai/assets/images/logos/NILG-AI_Logo-Secondary-White.svg" alt="NILG.AI">
</div>

<main class="palco">
  <h1 id="titulo">Um momento&hellip;</h1>
  <p class="sub" id="sub">A preparar a conversa.</p>

  <div class="ondas" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <button class="botao" id="atender" type="button" style="display:none" aria-label="Falar com o assistente">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/>
      <path d="M5 11v1a7 7 0 0 0 14 0v-1"/>
      <line x1="12" y1="19" x2="12" y2="22"/>
    </svg>
  </button>

  <p class="nota" id="nota" style="display:none">
    Ir&aacute;s falar com um assistente de intelig&ecirc;ncia artificial, n&atilde;o com uma pessoa.
    A conversa &eacute; gravada e transcrita. Vais precisar de dar acesso ao microfone.<br>
    <a href="https://nilg.ai/politica-de-privacidade-imersao-ia/" target="_blank" rel="noopener">Como tratamos os teus dados</a>
  </p>

  <div id="agente">
    <elevenlabs-convai agent-id="agent_8101ky2eh4h5ebtbanept79jvhmx" variant="compact"></elevenlabs-convai>
  </div>
</main>

<p class="rodape">NILG.AI &middot; <a href="https://eventos.nilg.ai/">Imers&atilde;o IA, 22 de setembro</a></p>

<script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>
<script>
(function () {
  var URL_CONTEXTO = 'https://n8n-service-0tpv.onrender.com/webhook/contexto-voz';
  var LOTE = { preco: '317', pct: '82' };

  var host   = document.querySelector('#agente elevenlabs-convai');
  var titulo = document.getElementById('titulo');
  var sub    = document.getElementById('sub');
  var botao  = document.getElementById('atender');
  var nota   = document.getElementById('nota');

  function mostrarErro(texto) {
    titulo.textContent = 'Este link já não está válido';
    sub.innerHTML = texto +
      '<a class="erro-acao" href="https://eventos.nilg.ai/">Ver o evento</a>';
    botao.style.display = 'none';
    nota.style.display = 'none';
  }

  var token = '';
  try { token = new URLSearchParams(location.search).get('v') || ''; } catch (e) {}

  if (!token) {
    mostrarErro('Abre a partir da mensagem que te enviámos, para eu saber quem és.<br>');
    return;
  }

  // tira o token da barra de endereço: não vale a pena ficar no histórico
  // nem viajar num screenshot
  try { history.replaceState(null, '', location.pathname); } catch (e) {}

  fetch(URL_CONTEXTO, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token })
  })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d || !d.ok || !d.lead_name) {
        mostrarErro('Pode ter expirado ou já ter sido usado. Fala connosco pelo WhatsApp e enviamos outro.<br>');
        return;
      }
      preparar(d);
    })
    .catch(function () {
      mostrarErro('Não consegui carregar a tua conversa. Tenta daqui a pouco.<br>');
    });

  function preparar(d) {
    var nome = d.lead_name;
    var empresa = d.lead_company || '';

    var contexto =
      'A saudação já foi dita antes de tu falares. Não te voltes a apresentar nem repitas ' +
      'quem és: uma só apresentação, e segues para o negócio dela.\n' +
      'COMO TE IDENTIFICAS EM MENSAGENS: qualquer WhatsApp, email ou SMS que envies sai de ' +
      'um número da equipa, não do telemóvel do André. Assinas sempre como agente de IA da ' +
      'NILG.AI. Nunca te apresentes como o André, como gémeo digital dele, nem como pessoa.\n' +
      'O QUE ELA LEVA (usa quando fizeres a ponte para o evento): "Sais no fim do dia com a ' +
      'tua própria jornada de cliente redesenhada, desde o momento em que a lead descobre a ' +
      'tua empresa, passando pela decisão de compra e experiência como cliente, até ao ' +
      'momento em que recomenda a tua marca a outros." Diz isto nas palavras do negócio ' +
      'dela: troca "a tua empresa" pelo nome real quando o souberes, e "lead" pela palavra ' +
      'do setor (aluno numa escola, doente numa clínica, hóspede num hotel, consumidor no ' +
      'retalho). Sem dados para personalizar, diz como está.\n' +
      'CANAL: a lead abriu o link que recebeu por WhatsApp, depois de preencher o ' +
      'formulário do anúncio. Já se identificou, já sabe que fala com uma IA e carregou ' +
      'no botão para falar contigo agora. Não perguntes se falas com ela nem se tem dois ' +
      'minutos: cumprimenta pelo nome e vai ao negócio dela.\n' +
      'DADOS DO CRM:\n' +
      '- Nome: ' + nome + '\n' +
      (empresa ? '- Empresa: ' + empresa + '\n' : '') +
      (d.lead_email ? '- Email: ' + d.lead_email + '\n' : '') +
      (d.lead_phone ? '- Telemóvel: ' + d.lead_phone + '\n' : '') +
      (d.origem ? '- Origem: ' + d.origem + '\n' : '') +
      (d.tem_briefing
        ? '\nO QUE JÁ SABEMOS DELA:\n' + d.briefing +
          '\n\nCOMO USAR: entra a demonstrar que percebeste o negócio dela, com uma frase ' +
          'curta e concreta, e põe logo uma hipótese de dor comercial em cima da mesa em ' +
          'forma de pergunta. Não leias isto em voz alta como uma lista. Se ela perguntar ' +
          'como sabes, diz a verdade sem rodeios: ficou registado quando ela deixou os dados ' +
          'no formulário, e o resto é informação pública da empresa. Nunca negues que ' +
          'temos ficha dela nem finjas que não consultaste nada. Se ela te corrigir, o que ' +
          'ela diz manda.'
        : '\nAinda não sabemos quase nada do negócio dela. Descobre na conversa o que fazem, ' +
          'a quem vendem e o que trava as vendas, antes de falares do evento.');

    host.setAttribute('dynamic-variables', JSON.stringify({
      lead_id:          d.lead_id || '',
      lead_name:        nome,
      lead_email:       d.lead_email || '',
      lead_phone:       d.lead_phone || '',
      lead_company:     empresa,
      lead_industry:    'não indicado',
      previous_context: contexto,
      preco_evento:     LOTE.preco,
      percentagem_lote: LOTE.pct
    }));

    host.setAttribute('override-first-message',
      'Olá ' + nome + ', sou o agente de IA da NILG.AI. Posso ir directo ao assunto?');

    titulo.textContent = 'Olá ' + nome + '.';
    sub.textContent = empresa
      ? 'Já sei o que faz a ' + empresa + '. Carrega e falamos, leva dois minutos.'
      : 'Carrega e falamos, leva dois minutos.';
    botao.style.display = 'grid';
    nota.style.display = 'block';
  }

  // ---- atender ----
  // O toque no botão é o gesto que o browser exige para pedir o microfone,
  // por isso é daqui que a chamada tem de arrancar.
  botao.addEventListener('click', function () {
    document.body.classList.add('em-chamada');
    titulo.textContent = 'A ligar…';
    sub.textContent = 'Dá acesso ao microfone quando o browser pedir.';
    arrancar(0);
  });

  function botaoDoWidget() {
    try {
      var bts = host.shadowRoot.querySelectorAll('button');
      for (var i = 0; i < bts.length; i++) {
        var r = (bts[i].getAttribute('aria-label') || '').toLowerCase();
        if (/chamada|call/.test(r)) return bts[i];
      }
    } catch (e) {}
    return null;
  }

  // o embed da ElevenLabs carrega em async: se ainda não estiver pronto,
  // tentamos outra vez por uns segundos em vez de falhar em silêncio
  function arrancar(tentativa) {
    var b = botaoDoWidget();
    if (b) { b.click(); vigiarFim(); return; }
    if (tentativa > 40) {
      document.body.classList.remove('em-chamada');
      mostrarErro('O assistente demorou a carregar. Atualiza a página e tenta outra vez.<br>');
      return;
    }
    setTimeout(function () { arrancar(tentativa + 1); }, 250);
  }

  // O widget não dispara nenhum evento de fim de chamada, por isso vigiamos
  // o botão dentro do shadow DOM: quando volta ao rótulo de "iniciar", acabou.
  function vigiarFim() {
    var raiz = host.shadowRoot;
    if (!raiz) return;
    var b = botaoDoWidget();
    var rotuloIniciar = b ? b.getAttribute('aria-label') : null;

    new MutationObserver(function (muts) {
      for (var i = 0; i < muts.length; i++) {
        var m = muts[i];
        if (m.type !== 'attributes' || m.attributeName !== 'aria-label') continue;
        if (m.target.tagName !== 'BUTTON') continue;
        if (rotuloIniciar === null) { rotuloIniciar = m.target.getAttribute('aria-label'); continue; }
        if (m.target.getAttribute('aria-label') !== rotuloIniciar) continue;
        if (!document.body.classList.contains('em-chamada')) continue;
        terminar();
      }
    }).observe(raiz, { subtree: true, childList: true, attributes: true, attributeFilter: ['aria-label'] });
  }

  function terminar() {
    document.body.classList.remove('em-chamada');
    titulo.textContent = 'Obrigado pela conversa.';
    sub.innerHTML = 'Se quiseres retomar, é só carregares outra vez.';
    botao.style.display = 'grid';
    nota.style.display = 'block';
  }
})();
</script>

</body>
</html>
